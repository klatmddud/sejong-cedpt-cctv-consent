<!DOCTYPE html>
<!--/* 모든 오류 화면(Spring Boot가 /error에서 보여 준다). 문구는 상태 코드별로 messages의 error.<코드>.*를 쓰고,
	따로 문구가 없는 코드는 4xx, 5xx 문구로 보인다. 오류 원문(message, trace)은 내보내지 않는다(Spring 기본값) */-->
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
	  th:with="key=${ {400, 403, 404, 405, 413, 500, 503}.contains(status) } ? ${status} : (${status >= 500} ? '5xx' : '4xx')">
<head th:replace="~{student/fragments :: head(${'error.' + key + '.title'})}"></head>
<body>
<header th:replace="~{student/fragments :: nav(null)}"></header>
<main class="page narrow">
	<section class="card complete-card error-card">
		<span class="complete-icon" aria-hidden="true">
			<svg class="icon" width="38" height="38" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>
		</span>
		<div class="page-head">
			<h1 th:text="#{${'error.' + key + '.title'}}">페이지를 찾을 수 없습니다</h1>
			<p class="muted" th:text="#{${'error.' + key + '.body'}}">주소가 바뀌었거나 없는 페이지입니다.</p>
		</div>
		<!--/* /error를 직접 열면 상태가 999다(실제 코드가 아님) */-->
		<span class="muted small" th:if="${status < 600}" th:text="#{error.code(${status})}">오류 코드 404</span>
		<!--/* 403은 오래 머물러 로그인이 끝난 경우(제출할 때 보안 토큰이 맞지 않음)가 많아 다시 로그인하게 한다 */-->
		<a class="button" th:if="${status == 403}" th:href="@{/login}" th:text="#{error.login}">다시 로그인</a>
		<a class="button" th:classappend="${status == 403} ? 'secondary'" th:href="@{/}" th:text="#{error.home}">처음 화면으로</a>
	</section>
</main>
<script th:src="@{/js/student-nav.js}"></script>
</body>
</html>
