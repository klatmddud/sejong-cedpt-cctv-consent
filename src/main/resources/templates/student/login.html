<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{student/fragments :: head('login.title')}"></head>
<body>
<header th:replace="~{student/fragments :: nav(null)}"></header>
<main class="page narrow">
	<a class="back-link" th:href="@{/}">
		<svg class="icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
		<span th:text="#{login.back}">언어 선택</span>
	</a>
	<div class="page-head">
		<h1 th:text="#{login.title}">CCTV 촬영 동의서 제출</h1>
		<p class="muted" th:text="#{app.subtitle}">세종대학교 컴퓨터공학과 실습실 수업 수강생</p>
	</div>

	<div class="alert error shake" role="alert" th:if="${loginError}">
		<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
		<span th:text="${loginError}">학번 또는 세종대 포털 비밀번호가 올바르지 않습니다.</span>
	</div>
	<div class="alert ok" role="status" th:if="${loggedOut}">
		<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
		<span th:text="#{login.logout}">로그아웃했습니다.</span>
	</div>

	<!--/* 관리자도 같은 폼을 쓴다(영문자가 섞인 아이디). 칸별 오류와 비밀번호 보기는 login-form.js가 붙인다 */-->
	<form class="card login-card" id="login-form" th:action="@{/login}" method="post">
		<div class="field">
			<label for="username" th:text="#{login.studentId}">학번</label>
			<input type="text" id="username" name="username" inputmode="numeric" pattern="[0-9]{8,10}|.*[A-Za-z].*"
				   autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus
				   aria-describedby="username-error"
				   th:attr="aria-invalid=${loginError != null}">
			<p class="field-error" id="username-error" hidden
			   th:data-missing="#{login.studentId.required}" th:data-pattern="#{login.studentId.pattern}"></p>
		</div>
		<div class="field">
			<label for="password" th:text="#{login.password}">세종대 포털 비밀번호</label>
			<div class="password-wrap">
				<input type="password" id="password" name="password" autocomplete="current-password" required
					   aria-describedby="password-error"
					   th:attr="aria-invalid=${loginError != null}">
				<button type="button" class="password-toggle" id="password-toggle" aria-pressed="false" hidden
						th:data-show="#{login.password.show}" th:data-hide="#{login.password.hide}"
						th:attr="aria-label=#{login.password.show}">
					<svg class="icon eye" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
					<svg class="icon eye-off" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="m2 2 20 20"/></svg>
				</button>
			</div>
			<p class="field-error" id="password-error" hidden th:data-missing="#{login.password.required}"></p>
			<!--/* 숨긴 안내는 aria-describedby로 묶으면 늘 읽히므로 바깥 p를 live 영역으로 두고 안쪽만 켜고 끈다 */-->
			<p class="field-hint" aria-live="polite">
				<span class="caution" id="caps-warning" hidden>
					<svg class="icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="m12 4-8 8h5v8h6v-8h5z"/></svg>
					<span th:text="#{login.capsLock}">Caps Lock이 켜져 있습니다.</span>
				</span>
			</p>
		</div>
		<button type="submit" class="button" th:text="#{login.submit}">로그인</button>
	</form>

	<section class="notes">
		<p>
			<span class="note-icon ok">
				<svg class="icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
			</span>
			<span th:text="#{login.note.password}">세종대 포털 계정으로 본인 확인만 하고, 비밀번호는 저장하지 않습니다.</span>
		</p>
		<p>
			<span class="note-icon caution">
				<svg class="icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
			</span>
			<span th:text="#{login.note.lock}">세종대 포털은 비밀번호를 5회 틀리면 계정이 잠깁니다.</span>
		</p>
	</section>
</main>
<script th:src="@{/js/login-form.js}"></script>
</body>
</html>
