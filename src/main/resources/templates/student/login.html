<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{student/fragments :: head('login.title')}"></head>
<body>
<header class="topbar">
	<div class="topbar-inner">
		<span class="brand" th:text="#{app.title}">CCTV 촬영 동의</span>
		<nav>
			<a th:href="@{/login(lang=#{language.switch.lang})}" th:text="#{language.switch}">English</a>
		</nav>
	</div>
</header>
<main class="page narrow">
	<a class="back-link" th:href="@{/}">
		<svg class="icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
		<span th:text="#{language.prompt}">언어를 선택하세요</span>
	</a>
	<div class="page-head">
		<h1 th:text="#{login.title}">CCTV 촬영 동의서 제출</h1>
		<p class="muted" style="font-size: 14px" th:text="#{app.subtitle}">세종대학교 컴퓨터공학과 실습실 수업 수강생</p>
	</div>

	<div class="alert error" role="alert" th:if="${loginError}">
		<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
		<span th:text="${loginError}">학번 또는 세종대 포털 비밀번호가 올바르지 않습니다.</span>
	</div>
	<div class="alert ok" role="status" th:if="${param.logout}">
		<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
		<span th:text="#{login.logout}">로그아웃했습니다.</span>
	</div>

	<form class="card" th:action="@{/login}" method="post">
		<label class="field">
			<span th:text="#{login.studentId}">학번</span>
			<input type="text" name="username" inputmode="numeric" pattern="[0-9]{8,10}" autocomplete="username" required autofocus
				   th:attr="aria-invalid=${loginError != null}">
		</label>
		<label class="field">
			<span th:text="#{login.password}">세종대 포털 비밀번호</span>
			<input type="password" name="password" autocomplete="current-password" required
				   th:attr="aria-invalid=${loginError != null}">
		</label>
		<button type="submit" class="button" th:text="#{login.submit}">로그인</button>
	</form>

	<section class="notes">
		<p>
			<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
			<span th:text="#{login.note.password}">세종대 포털 계정으로 본인 확인만 하고, 비밀번호는 저장하지 않습니다.</span>
		</p>
		<p>
			<svg class="icon caution" aria-hidden="true" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
			<span th:text="#{login.note.lock}">세종대 포털은 비밀번호를 5회 틀리면 계정이 잠깁니다.</span>
		</p>
	</section>
</main>
</body>
</html>
