<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{student/fragments :: head('landing.title')}"></head>
<body>
<header class="band">
	<p>세종대학교 컴퓨터공학과</p>
</header>
<main class="page narrow centered">
	<div class="hero">
		<span class="hero-icon">
			<svg class="icon" aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" stroke-width="1.75"><path d="M16.75 12h3.63a1 1 0 0 1 .7 1.7l-4.17 4.17a1 1 0 0 1-1.41 0l-1.13-1.13"/><path d="M2.29 9.62a1 1 0 0 1 0-1.41l4.17-4.17a1 1 0 0 1 1.41 0l9.83 9.83a1 1 0 0 1 0 1.41l-1.12 1.13a1 1 0 0 1-1.42 0Z"/><path d="M7 20v-4.5"/><path d="M2 20h5"/></svg>
		</span>
		<h1>CCTV 촬영 및 이용 동의</h1>
		<p class="muted" lang="en">Consent to CCTV Recording and Use</p>
		<p class="muted" style="font-size: 14px">실습실(B201·B202·B203·B206·B207) 수업 수강생<br><span lang="en">For lab course students</span></p>
	</div>

	<section class="card" aria-labelledby="choose-language">
		<p class="choice-label muted" id="choose-language">언어를 선택하세요 · <span lang="en">Choose your language</span></p>
		<a class="choice" th:href="@{/login(lang='ko')}" lang="ko">
			<span>한국어</span>
			<svg class="icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
		</a>
		<a class="choice secondary" th:href="@{/login(lang='en')}" lang="en">
			<span>English</span>
			<svg class="icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
		</a>
	</section>
</main>
</body>
</html>
