<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{student/fragments :: head('sign.title')}"></head>
<body>
<header th:replace="~{student/fragments :: nav(${student})}"></header>
<main class="page narrow">
	<section class="card">
		<p class="breadcrumb"><a th:href="@{/consents}" th:text="#{courses.title}">내 수업</a> /</p>
		<h1 th:text="#{sign.title}">동의서 작성</h1>

		<article th:replace="~{student/fragments :: document}"></article>

		<p class="alert error" th:if="${error}" th:text="${error}">서명을 입력하세요.</p>

		<form th:action="@{/consents/sign}" method="post" class="consent-form">
			<input type="hidden" name="signature" id="signature">

			<fieldset class="course-select">
				<legend class="field-label" th:text="#{sign.courses}">동의할 수업</legend>
				<p class="muted small" th:text="#{sign.courses.hint}">서명 한 번으로 선택한 수업마다 동의서가 제출됩니다.</p>
				<label class="check" th:each="course : ${courses}">
					<input type="checkbox" name="enrollmentIds" th:value="${course.enrollmentId}" checked>
					<span>
						<strong th:text="${course.courseName}">공업수학1</strong>
						<span class="muted small" th:text="|${course.semester} · ${course.room} · ${course.courseCode}|">2026-2학기 · 센B201 · 000304-001</span>
					</span>
				</label>
			</fieldset>

			<label class="check">
				<input type="checkbox" name="agreed" value="true" required>
				<span th:text="#{sign.agree}">개인 영상정보의 수집·이용·제공에 동의합니다.</span>
			</label>

			<div class="signature-field">
				<div class="signature-head">
					<span class="field-label" id="signature-label" th:text="#{sign.signature}">서명</span>
					<button type="button" class="link" id="signature-clear" th:text="#{sign.clear}">다시 쓰기</button>
				</div>
				<canvas id="signature-pad" class="signature-pad" aria-labelledby="signature-label" role="img"></canvas>
				<p class="field-error" id="signature-error" hidden th:text="#{sign.signature.required}">네모 칸 안에 서명하세요.</p>
				<p class="muted small" th:text="#{sign.signer(${student.name})}">동의인: 홍길동</p>
			</div>

			<button type="submit" class="primary" th:text="#{sign.submit}">동의서 제출</button>
			<p class="muted small" th:text="#{sign.note}">제출한 동의서는 수정할 수 없습니다.</p>
		</form>
	</section>
</main>
<script th:src="@{/js/signature-pad.js}"></script>
</body>
</html>
