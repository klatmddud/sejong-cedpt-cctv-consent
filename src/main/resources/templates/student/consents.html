<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{student/fragments :: head('내 수업')}"></head>
<body>
<header th:replace="~{student/fragments :: nav(${student})}"></header>
<main class="page narrow">
	<p class="alert ok" th:if="${submitted}" th:text="|${submitted} 동의서를 제출했습니다.|">공업수학1 동의서를 제출했습니다.</p>

	<section class="card">
		<h1>내 수업</h1>
		<p class="muted">실습실 CCTV 촬영 동의서는 학기마다 수업별로 한 번씩 제출합니다.</p>

		<div class="empty" th:if="${#lists.isEmpty(courses)}">
			<p><strong>동의서를 제출할 수업이 없습니다.</strong></p>
			<p class="muted">실습실 수업을 듣는데 목록에 없다면 수강 변경이 명부에 아직 반영되지 않았을 수 있습니다. 학과 조교에게 문의하세요.</p>
		</div>

		<ul class="course-list" th:unless="${#lists.isEmpty(courses)}">
			<li class="course" th:each="course : ${courses}">
				<div class="course-info">
					<p class="course-name" th:text="${course.courseName}">공업수학1</p>
					<p class="muted" th:text="|${course.room} · ${course.professor ?: '-'} · ${course.schedule ?: '-'}|">센B201 · 홍길동 · 월10:30-12:00</p>
				</div>
				<div class="course-action" th:if="${course.signed()}">
					<span class="badge done">제출 완료</span>
					<a th:href="@{/consents/{id}/pdf(id=${course.enrollmentId})}" target="_blank" rel="noopener">동의서 보기</a>
				</div>
				<div class="course-action" th:unless="${course.signed()}">
					<span class="badge todo">미제출</span>
					<a class="button" th:href="@{/consents/{id}(id=${course.enrollmentId})}">동의서 작성</a>
				</div>
			</li>
		</ul>
	</section>
</main>
</body>
</html>
