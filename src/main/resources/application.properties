spring.application.name=cctv-consent

# Behind Caddy: trust X-Forwarded-* from the proxy so redirects and cookies use https
server.forward-headers-strategy=native

# PostgreSQL: set DB_URL, DB_USERNAME, DB_PASSWORD (server: ~/cctv-consent/app.env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cctv_consent}
spring.datasource.username=${DB_USERNAME:cctv_consent}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
# Schema is owned by Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 기본 1MB 제한을 늘려 수강명부 xlsx(약 3MB) 업로드 허용
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 학생 화면 문구: messages.properties(한국어, 기본), messages_en.properties
# 서버 OS 언어로 대신 보여 주지 않도록 끈다 (한국어 요청이 영어로 나오는 것 방지)
spring.messages.fallback-to-system-locale=false

# 관리자 공용 계정. 비밀번호는 BCrypt 해시로만 둔다 (만드는 법: deploy/README.md)
admin.username=${ADMIN_USERNAME:admin}
admin.password-hash=${ADMIN_PASSWORD_HASH:}

# 동의서를 받을 강의실 (명부의 강의실 표기에서 건물 약자를 뗀 값과 비교)
consent.target-rooms=B201,B202,B203,B206,B207

# CSS, JS, 이미지는 내용 해시를 붙인 주소(/css/student-<hash>.css)로 내보내고 1년 캐시한다. 내용이 바뀌면 주소가 바뀐다.
# 템플릿의 @{...}가 해시 주소로 바꾼다. 개인정보가 든 HTML과 PDF는 Spring Security 기본값(no-store) 그대로다
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/img/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
# 템플릿의 모든 @{...} 링크(/consents 같은 정적 파일이 아닌 것 포함)를 정적 파일 위치마다 찾아본다. 정적 파일은 static에만 둔다
spring.web.resources.static-locations=classpath:/static/

# 작은 서버(지속 CPU 약 1/8 OCPU)라 동시에 처리하는 요청 수를 줄인다. 기본 200개 스레드가 CPU를 나눠 쓰면 모든 요청이 함께 느려지고
# 메모리도 더 든다. 넘치는 요청은 연결 대기열에서 기다린다. 부하 테스트(0.25 CPU, 동시 50명)에서 200개는 응답이 60초를 넘겼고 32개는 버텼다.
# 대신 포털을 기다리는 로그인이 스레드를 차지하므로, CPU가 넉넉한 서버(2 CPU, 동시 200명)에서는 서명 응답이 0.07초에서 6.5초로 느려졌다.
# 서버를 키우면 기본값(200)으로 되돌린다
server.tomcat.threads.max=32
# Spring Security 필터마다 관측(observation)을 감싸는 비용을 없앤다. 메트릭을 내보내지 않는다
management.observations.enable.spring.security=false
