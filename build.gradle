plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.ac.sejong.cedpt'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.dhatim:fastexcel-reader:0.19.0'
	implementation 'org.apache.pdfbox:pdfbox:3.0.7'
	runtimeOnly 'org.postgresql:postgresql'

	// 로컬 실행(local 프로필) 전용: Docker 없이 PostgreSQL을 띄우고, 코드 수정 시 자동 재시작. 배포 jar에는 포함되지 않는다.
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	compileOnly 'io.zonky.test:embedded-postgres:2.1.0'
	developmentOnly 'io.zonky.test:embedded-postgres:2.1.0'
	developmentOnly enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.5.0')
	developmentOnly 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	// 테스트용 xlsx 생성, Docker 없이 실제 PostgreSQL 실행
	testImplementation 'org.dhatim:fastexcel:0.19.0'
	testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
	testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.5.0')
	testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8'
	testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-linux-amd64'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	// 로컬 .env 값을 테스트 환경 변수로 넘긴다 (SjptClientLiveTest용, 빈 값은 무시)
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.eachLine { line ->
			def entry = line.trim()
			if (entry && !entry.startsWith('#') && entry.contains('=')) {
				def (key, value) = entry.split('=', 2).collect { it.trim() }
				value = value.replaceAll(/^(["'])(.*)\1$/, '$2')
				if (value) {
					environment key, value
				}
			}
		}
	}
}
