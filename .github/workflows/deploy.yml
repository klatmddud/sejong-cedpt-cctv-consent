name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            IMAGE=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Fail before removing the running container if server secrets are missing
            test -f "$HOME/cctv-consent/app.env" || { echo "missing ~/cctv-consent/app.env (see deploy/README.md)"; exit 1; }
            docker pull "$IMAGE:${{ github.sha }}"
            # Caddy (deploy/Caddyfile) terminates HTTPS and proxies to this container over the "web" network
            docker network inspect web >/dev/null 2>&1 || docker network create web
            docker rm -f cctv-consent 2>/dev/null || true
            # DB credentials live only on the server (created by deploy/README.md setup)
            docker run -d --name cctv-consent \
              --restart unless-stopped \
              --memory 640m \
              --network web \
              --env-file "$HOME/cctv-consent/app.env" \
              "$IMAGE:${{ github.sha }}"
            docker logout ghcr.io
            docker image prune -af --filter "until=72h"
