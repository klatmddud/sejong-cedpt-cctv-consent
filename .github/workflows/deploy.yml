name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # 서드파티 액션은 가변 태그(v5 등)가 아니라 커밋 SHA로 고정한다(공급망 공격 방지). 올릴 때는 각 릴리스를 확인하고 SHA를 바꾼다.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      # 서버 SSH 키를 넘기는 서드파티 액션이라 태그가 아닌 커밋으로 고정한다(v1.2.5). 올릴 때는 릴리스를 확인하고 SHA를 바꾼다
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 서버 호스트 키를 검증해 중간자(MITM) 공격을 막는다. 서버에서 `ssh-keygen -lf /etc/ssh/ssh_host_ecdsa_key.pub | cut -d' ' -f2`가
          # 출력하는 지문(SHA256:로 시작)을 SERVER_SSH_FINGERPRINT 시크릿에 넣는다. 이 액션은 ECDSA 호스트 키로 접속하므로
          # ED25519 지문을 넣으면 "host key fingerprint mismatch"로 실패한다. 공개키(ssh-keyscan 출력)를 그대로 넣어도
          # 배포가 실패한다. 시크릿이 없거나 비어 있으면 아무 경고 없이 검증을 건너뛴다(예전 동작).
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script: |
            set -e
            IMAGE=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Fail before removing the running container if server secrets are missing
            test -f "$HOME/cctv-consent/app.env" || { echo "missing ~/cctv-consent/app.env (see deploy/README.md)"; exit 1; }
            grep -q '^ADMIN_PASSWORD_HASH=\$2' "$HOME/cctv-consent/app.env" || { echo "ADMIN_PASSWORD_HASH missing in app.env (see deploy/README.md)"; exit 1; }
            docker pull "$IMAGE:${{ github.sha }}"
            # Caddy (deploy/Caddyfile) terminates HTTPS and proxies to this container over the "web" network
            docker network inspect web >/dev/null 2>&1 || docker network create web
            docker rm -f cctv-consent 2>/dev/null || true
            # DB credentials live only on the server (created by deploy/README.md setup)
            # 감사 로그 파일은 cctv_app_logs volume에 두어 컨테이너를 다시 만들어도 남긴다. docker logs는 컨테이너와 함께
            # 지워지므로 크기만 제한한다(10MB x 3)
            docker run -d --name cctv-consent \
              --restart unless-stopped \
              --memory 640m \
              --network web \
              --env-file "$HOME/cctv-consent/app.env" \
              -v cctv_app_logs:/app/logs \
              --log-opt max-size=10m --log-opt max-file=3 \
              "$IMAGE:${{ github.sha }}"
            docker logout ghcr.io
            docker image prune -af --filter "until=72h"
